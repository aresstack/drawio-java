# Maven Central switch (docs/RELEASE.md, "Maven Central").
# false: a v* tag builds, stages and signs the Maven bundle and creates the
#        GitHub Release, but uploads nothing to Maven Central.
# true:  a v* tag also publishes com.aresstack:drawio-java and
#        com.aresstack:drawio-java-stencils to Maven Central (automatic, like
#        mermaid-java). Publishing to Central cannot be undone.
# An existing tag can be published later without this switch: run the Release
# workflow by hand on that tag with "publish_to_central" ticked.
mavenCentral.publish=false
