plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
}

group = 'com.aresstack'
// Release builds pass -PreleaseVersion=x.y.z (see docs/RELEASE.md).
version = findProperty('releaseVersion') ?: '0.1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
    withSourcesJar()
    withJavadocJar()
}

tasks.named('javadoc', Javadoc) {
    options.encoding = 'UTF-8'
    // Java 8 doclint rejects some valid-but-terse comments; keep the build
    // about content, not Javadoc style.
    options.addStringOption('Xdoclint:none', '-quiet')
}

dependencies {
    implementation 'org.graalvm.sdk:graal-sdk:21.3.20.0.3'
    implementation 'org.graalvm.js:js:21.3.20.0.3'
    implementation 'org.apache.xmlgraphics:batik-svggen:1.20'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.apache.xmlgraphics:batik-transcoder:1.20'
    // Lets the test rasterizer decode PNG data: URIs in our SVG output.
    testImplementation 'org.apache.xmlgraphics:batik-codec:1.20'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

// Dependency scan support (#15): CI writes a throwaway gradle.lockfile with
// -PlockForScan so OSV-Scanner can read the resolved versions. Nothing is
// locked in normal builds.
if (project.hasProperty('lockForScan')) {
    dependencyLocking {
        lockAllConfigurations()
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Consumer JDK used to *run* tests and the consumer smoke test (#15).
// The library is always compiled with the Java 8 toolchain; CI sets
// -PtestJavaVersion=11/17/21 to prove the Java 8 artifact works on newer
// consumer JDKs.
def testJavaVersion = Integer.parseInt((findProperty('testJavaVersion') ?: '8').toString())
def testLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(testJavaVersion)
}

// Deterministic, display-independent AWT for all rendering tests: no X11,
// no desktop accessibility bridge (Ubuntu's openjdk-8 otherwise fails with
// "Assistive Technology not found" as soon as Batik touches the Toolkit).
def headlessJvmArgs = [
        '-Djava.awt.headless=true',
        '-Djavax.accessibility.assistive_technologies=',
        '-Dfile.encoding=UTF-8',
        '-Duser.language=en',
        '-Duser.country=US'
]

tasks.named('test', Test) {
    useJUnitPlatform()
    javaLauncher = testLauncher
    jvmArgs headlessJvmArgs
    // GraalJS on a stock JDK runs without the Graal JIT; silence the
    // one-time interpreter warning so it does not hide real test output.
    systemProperty 'polyglot.engine.WarnInterpreterOnly', 'false'
    // Corpus report (#13): rendered images, diffs and scores per fixture.
    systemProperty 'corpus.reportDir', layout.buildDirectory.dir('reports/corpus').get().asFile.absolutePath
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

// ---------------------------------------------------------------------------
// Optional stencil artifact (docs/LICENSE-REVIEW.md, section 2). The draw.io
// XML stencil data carries the upstream Atlassian distribution restriction, so
// it is left out of the main jar and published as drawio-java-stencils. The
// source file stays in src/main/resources, where js-bundle/build.mjs writes and
// verifies it, so this repository's own tests keep it on their classpath.
// OriginalGraphPipeline loads it only when it is on the classpath; no code
// change is needed in either direction. To fold it back into the main jar,
// follow docs/STENCILS.md, "Optional artifact drawio-java-stencils".
// ---------------------------------------------------------------------------
def stencilResources = ['drawio/drawio-stencils.js']
// Legacy bundles of the stub-based regression tests (#4-#7). The production
// pipeline (OriginalGraphPipeline) never loads them, so they stay on the test
// classpath only and are not shipped (about 235 KB). To ship them again,
// remove them from this list.
def testOnlyResources = ['drawio/drawio-model.js', 'drawio/drawio-shapes.js']

tasks.named('jar', Jar) {
    exclude stencilResources
    exclude testOnlyResources
    manifest {
        attributes('Implementation-Title': 'drawio-java',
                'Implementation-Version': project.version)
    }
    // License and notice material travels with the binary (#15).
    from(rootProject.file('THIRD-PARTY-NOTICES.md')) {
        into 'META-INF'
    }
    from(rootProject.fileTree(rootProject.projectDir) { include 'LICENSE', 'LICENSE.txt', 'NOTICE' }) {
        into 'META-INF'
    }
}

tasks.named('sourcesJar', Jar) {
    exclude stencilResources
    exclude testOnlyResources
}

// ---- drawio-java-stencils (begin) -----------------------------------------
def stencilsDir = rootProject.file('src/stencils')
def drawioLicense = rootProject.file('src/main/resources/drawio/upstream/LICENSE')

def stencilsJar = tasks.register('stencilsJar', Jar) {
    group = 'build'
    description = 'Assembles drawio-java-stencils: the optional draw.io XML stencil data.'
    archiveBaseName = 'drawio-java-stencils'
    from(tasks.named('processResources')) {
        include stencilResources
    }
    // The stencil data is draw.io's, under draw.io's Apache-2.0 license plus
    // the upstream README restriction described in the notice.
    from(new File(stencilsDir, 'THIRD-PARTY-NOTICES.md')) {
        into 'META-INF'
    }
    from(drawioLicense) {
        into 'META-INF'
    }
    manifest {
        attributes('Implementation-Title': 'drawio-java-stencils',
                'Implementation-Version': project.version)
    }
}

// Maven Central wants a sources and a javadoc jar for every jar artifact. The
// stencil data is its own source; there is no Java API to document.
def stencilsSourcesJar = tasks.register('stencilsSourcesJar', Jar) {
    group = 'build'
    description = 'Assembles the sources jar of drawio-java-stencils.'
    archiveBaseName = 'drawio-java-stencils'
    archiveClassifier = 'sources'
    from(sourceSets.main.resources) {
        include stencilResources
    }
    from(new File(stencilsDir, 'THIRD-PARTY-NOTICES.md')) {
        into 'META-INF'
    }
    from(drawioLicense) {
        into 'META-INF'
    }
}

def stencilsJavadocJar = tasks.register('stencilsJavadocJar', Jar) {
    group = 'build'
    description = 'Assembles the documentation-only javadoc jar of drawio-java-stencils.'
    archiveBaseName = 'drawio-java-stencils'
    archiveClassifier = 'javadoc'
    from(new File(stencilsDir, 'README.md'))
    from(new File(stencilsDir, 'THIRD-PARTY-NOTICES.md')) {
        into 'META-INF'
    }
}

tasks.named('assemble') {
    dependsOn stencilsJar, stencilsSourcesJar, stencilsJavadocJar
}
// ---- drawio-java-stencils (end) -------------------------------------------

// ---------------------------------------------------------------------------
// Publication (#15). `gradlew publish` stages a Maven-Central-layout bundle in
// build/staging-deploy; the release workflow zips and uploads it. The project
// is MIT-licensed (LICENSE, copied into META-INF by the jar task).
// ---------------------------------------------------------------------------
// POM metadata shared by both publications.
def commonPom = { MavenPom pom ->
    pom.url = 'https://github.com/aresstack/drawio-java'
    // Same developer entry as mermaid-java's pom.xml.
    pom.developers {
        developer {
            id = 'miguel0888'
            name = 'miguel0888'
            organization = 'aresstack'
            organizationUrl = 'https://github.com/aresstack'
        }
    }
    pom.scm {
        url = 'https://github.com/aresstack/drawio-java'
        connection = 'scm:git:https://github.com/aresstack/drawio-java.git'
        developerConnection = 'scm:git:ssh://git@github.com/aresstack/drawio-java.git'
    }
    pom.issueManagement {
        system = 'GitHub'
        url = 'https://github.com/aresstack/drawio-java/issues'
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'drawio-java'
            from components.java
            pom {
                name = 'drawio-java'
                description = 'Headless draw.io diagram rendering for Java 8+: the original draw.io JavaScript on GraalJS, painted with Java2D to BufferedImage, PNG and SVG. No browser, Node.js or network access. The draw.io XML stencil data is published separately as the optional drawio-java-stencils.'
                url = 'https://github.com/aresstack/drawio-java'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                        distribution = 'repo'
                    }
                }
                commonPom(delegate)
            }
        }
        // ---- drawio-java-stencils (begin) ----
        mavenStencils(MavenPublication) {
            artifactId = 'drawio-java-stencils'
            artifact stencilsJar
            artifact stencilsSourcesJar
            artifact stencilsJavadocJar
            pom {
                name = 'drawio-java-stencils'
                description = 'Optional draw.io XML stencil data (arrows, basic, bpmn, flowchart) for drawio-java, unchanged from jgraph/drawio commit c72c9a98. Apache-2.0, with an additional upstream restriction: the draw.io README states that its icon sets and stencil libraries may not be used as software assets in, distributed for use with, or incorporated into Atlassian products or products distributed through the Atlassian Marketplace or plugin ecosystem without explicit written permission. Leave this artifact out in such products; drawio-java then reports these shapes as UNSUPPORTED_STENCIL.'
                packaging = 'jar'
                licenses {
                    license {
                        name = 'Apache-2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        comments = 'draw.io stencil data. The upstream README adds a restriction for Atlassian products and the Atlassian Marketplace; see META-INF/THIRD-PARTY-NOTICES.md in the jar.'
                    }
                }
                commonPom(delegate)
            }
        }
        // ---- drawio-java-stencils (end) ----
    }
    repositories {
        maven {
            name = 'staging'
            url = layout.buildDirectory.dir('staging-deploy')
        }
    }
}

// Signing, two ways (docs/RELEASE.md):
// - CI, like mermaid-java: actions/setup-java imports the GPG_PRIVATE_KEY
//   secret into gpg, the build runs with -PsignWithGpg and Gradle signs through
//   the gpg command. The passphrase comes from MAVEN_GPG_PASSPHRASE, the same
//   variable mermaid-java's maven-gpg-plugin reads.
// - Local or ad hoc: -PsigningKey=<ASCII-armored secret key> and
//   -PsigningPassword=<passphrase> (or ORG_GRADLE_PROJECT_signingKey/...),
//   signed in memory without a gpg installation.
// Without either, `publish` stages an unsigned bundle (fine for dry runs; Maven
// Central rejects it).
signing {
    def signingKey = findProperty('signingKey')
    def signingPassword = findProperty('signingPassword')
    def signWithGpg = project.hasProperty('signWithGpg')
    required = { signWithGpg || signingKey != null }
    if (signWithGpg) {
        def passphrase = System.getenv('MAVEN_GPG_PASSPHRASE')
        if (passphrase && !project.hasProperty('signing.gnupg.passphrase')) {
            project.ext.set('signing.gnupg.passphrase', passphrase)
        }
        useGpgCmd()
    } else if (signingKey) {
        useInMemoryPgpKeys(signingKey.toString(), (signingPassword ?: '').toString())
    }
    if (signWithGpg || signingKey) {
        // Both publications, so every staged artifact of drawio-java-stencils
        // gets its .asc like the main one.
        sign publishing.publications.mavenJava, publishing.publications.mavenStencils
    }
}

tasks.register('benchmark', JavaExec) {
    description = 'Measure GraalJS context cost for a render-shaped workload (#14).'
    group = 'verification'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.aresstack.drawio.graal.GraalJsBenchmark'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(8)
    }
    maxHeapSize = '1g'
    jvmArgs headlessJvmArgs
    systemProperties System.getProperties().findAll { it.key.toString().startsWith('bench.') || it.key.toString().startsWith('drawio.') }
}

// ---------------------------------------------------------------------------
// Java 8 bytecode gate (#15): every class in the published jar must be
// class-file major version 52 (Java 8) or lower.
// ---------------------------------------------------------------------------
def verifyJava8Bytecode = tasks.register('verifyJava8Bytecode') {
    group = 'verification'
    description = 'Fails if any class in the main jar targets a Java version newer than 8.'
    def jarTask = tasks.named('jar', Jar)
    dependsOn jarTask
    inputs.files(jarTask)
    doLast {
        def jarFile = jarTask.get().archiveFile.get().asFile
        def offenders = []
        int classes = 0
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            zip.entries().each { entry ->
                if (!entry.name.endsWith('.class')) {
                    return
                }
                classes++
                zip.getInputStream(entry).withCloseable { stream ->
                    def data = new DataInputStream(stream)
                    if (data.readInt() != 0xCAFEBABE as int) {
                        offenders << "${entry.name} (not a class file)"
                        return
                    }
                    data.readUnsignedShort()
                    int major = data.readUnsignedShort()
                    if (major > 52) {
                        offenders << "${entry.name} (major ${major})"
                    }
                }
            }
        }
        if (classes == 0) {
            throw new GradleException("No classes found in ${jarFile}")
        }
        if (!offenders.isEmpty()) {
            throw new GradleException('Classes newer than Java 8 in jar:\n  ' + offenders.join('\n  '))
        }
        logger.lifecycle("verifyJava8Bytecode: ${classes} classes in ${jarFile.name} target Java 8 (major <= 52)")
    }
}

// ---------------------------------------------------------------------------
// Offline consumer smoke test (#15): a separate source set compiled and run
// against the *packaged jar* plus runtime dependencies only (no main classes
// directory, no test resources, no Node.js, no browser). Network access is
// pointed at a dead SOCKS proxy so any accidental download fails loudly.
// ---------------------------------------------------------------------------
sourceSets {
    consumerSmoke {
        compileClasspath = files(tasks.named('jar')) + configurations.runtimeClasspath
        runtimeClasspath = output + compileClasspath
    }
}

tasks.named('compileConsumerSmokeJava', JavaCompile) {
    dependsOn tasks.named('jar')
}

def consumerSmokeJvmArgs = headlessJvmArgs + [
        '-DsocksProxyHost=127.0.0.1',
        '-DsocksProxyPort=9',
        '-Dpolyglot.engine.WarnInterpreterOnly=false'
]

def consumerSmokeTest = tasks.register('consumerSmokeTest', JavaExec) {
    group = 'verification'
    description = 'Runs a minimal offline consumer against the packaged main jar alone.'
    classpath = sourceSets.consumerSmoke.runtimeClasspath
    mainClass = 'com.aresstack.drawio.consumersmoke.OfflineConsumerSmoke'
    // main-only: XML stencils must fail as UNSUPPORTED_STENCIL. Use
    // with-stencils here if the stencil data is folded back into the main jar.
    args 'main-only'
    javaLauncher = testLauncher
    jvmArgs consumerSmokeJvmArgs
}

tasks.named('check') {
    dependsOn verifyJava8Bytecode, consumerSmokeTest
}

// ---- drawio-java-stencils checks (begin) ----------------------------------
def consumerSmokeStencilsTest = tasks.register('consumerSmokeStencilsTest', JavaExec) {
    group = 'verification'
    description = 'Runs the offline consumer against the main jar plus the drawio-java-stencils jar.'
    classpath = sourceSets.consumerSmoke.runtimeClasspath + files(stencilsJar)
    mainClass = 'com.aresstack.drawio.consumersmoke.OfflineConsumerSmoke'
    args 'with-stencils'
    javaLauncher = testLauncher
    jvmArgs consumerSmokeJvmArgs
}

def verifyStencilArtifact = tasks.register('verifyStencilArtifact') {
    group = 'verification'
    description = 'Fails unless the stencil data is only in drawio-java-stencils, with its notices.'
    def mainJar = tasks.named('jar', Jar)
    def mainSources = tasks.named('sourcesJar', Jar)
    dependsOn mainJar, mainSources, stencilsJar, stencilsSourcesJar, stencilsJavadocJar
    inputs.files(mainJar, mainSources, stencilsJar, stencilsSourcesJar, stencilsJavadocJar)
    doLast {
        def entries = { Jar task ->
            def file = task.archiveFile.get().asFile
            new java.util.zip.ZipFile(file).withCloseable { zip -> zip.entries().collect { it.name } as Set }
        }
        def problems = []
        [mainJar.get(), mainSources.get()].each { task ->
            def names = entries(task)
            stencilResources.each { resource ->
                if (names.contains(resource)) {
                    problems << "${task.archiveFileName.get()} must not contain ${resource}"
                }
            }
            if (!names.contains('drawio/drawio-stencil-runtime.js') && task.name == 'jar') {
                problems << "${task.archiveFileName.get()} lost drawio/drawio-stencil-runtime.js"
            }
        }
        [stencilsJar.get(), stencilsSourcesJar.get()].each { task ->
            def names = entries(task)
            (stencilResources + ['META-INF/THIRD-PARTY-NOTICES.md', 'META-INF/LICENSE']).each { resource ->
                if (!names.contains(resource)) {
                    problems << "${task.archiveFileName.get()} is missing ${resource}"
                }
            }
            def classes = names.findAll { it.endsWith('.class') }
            if (!classes.isEmpty()) {
                problems << "${task.archiveFileName.get()} must hold data only, found ${classes}"
            }
        }
        if (!entries(stencilsJavadocJar.get()).contains('META-INF/THIRD-PARTY-NOTICES.md')) {
            problems << "${stencilsJavadocJar.get().archiveFileName.get()} is missing META-INF/THIRD-PARTY-NOTICES.md"
        }
        if (!problems.isEmpty()) {
            throw new GradleException('Stencil artifact split is broken:\n  ' + problems.join('\n  '))
        }
        logger.lifecycle("verifyStencilArtifact: ${stencilResources} only in ${stencilsJar.get().archiveFileName.get()}")
    }
}

tasks.named('check') {
    dependsOn consumerSmokeStencilsTest, verifyStencilArtifact
}
// ---- drawio-java-stencils checks (end) ------------------------------------

// Developer tool: ./gradlew renderFiles -PrenderArgs="outDir file.drawio ..."
tasks.register('renderFiles', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.aresstack.drawio.visual.RenderToFiles'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(8) }
    args = (project.findProperty('renderArgs') ?: 'build/visual').toString().split(' ').toList()
}
