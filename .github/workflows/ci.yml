name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly re-check of known vulnerabilities in the resolved dependencies.
    - cron: '17 4 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Gradle finds the toolchains installed by setup-java through these
  # variables and never downloads a JDK on its own.
  GRADLE_TOOLCHAIN_ARGS: >-
    -Porg.gradle.java.installations.auto-download=false
    -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_11_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64

jobs:
  # Reference job: Java 8 toolchain, bundle verification, full check
  # (tests, Java 8 bytecode gate, offline consumer-jar smoke test).
  test:
    name: Java 8 build (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install JDK 8 (library toolchain) and JDK 17 (Gradle runtime)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pinned offline Draw.io bundle
        run: node js-bundle/build.mjs --verify
      - name: Build, test, Java 8 bytecode gate, offline consumer smoke
        run: bash ./gradlew --no-daemon $GRADLE_TOOLCHAIN_ARGS clean build
      - name: Upload corpus report (rendered images, diffs, scores)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-report
          path: build/reports/corpus/
          if-no-files-found: ignore
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-linux-java8
          path: build/reports/
          if-no-files-found: ignore

  # Consumer JDKs: the same Java 8 jar, tests and consumer smoke test run
  # on newer JDKs and on Windows.
  consumer-jdk:
    name: Consumer JDK ${{ matrix.java }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, java: '11' }
          - { os: ubuntu-latest, java: '17' }
          - { os: ubuntu-latest, java: '21' }
          - { os: windows-latest, java: '8' }
          - { os: windows-latest, java: '21' }
    steps:
      - uses: actions/checkout@v4
      - name: Install JDK 8, consumer JDK ${{ matrix.java }} and JDK 17 (Gradle runtime)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            ${{ matrix.java }}
            17
          cache: gradle
      - name: Test on consumer JDK ${{ matrix.java }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then GRADLE=./gradlew.bat; else GRADLE=./gradlew; fi
          $GRADLE --no-daemon $GRADLE_TOOLCHAIN_ARGS -PtestJavaVersion=${{ matrix.java }} clean check
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}-java${{ matrix.java }}
          path: build/reports/
          if-no-files-found: ignore

  # Known-vulnerability scan of the resolved dependency tree (#15). Report-only:
  # scanners attribute many JDK-component CVEs to graal-sdk (see
  # docs/SECURITY.md), so findings are triaged by hand instead of blocking.
  dependency-scan:
    name: Dependency vulnerability scan (OSV)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    env:
      OSV_SCANNER_VERSION: v2.2.4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
          cache: gradle
      - name: Resolve dependencies into a throwaway lockfile
        run: bash ./gradlew --no-daemon $GRADLE_TOOLCHAIN_ARGS -PlockForScan dependencies --write-locks > /dev/null
      - name: Install OSV-Scanner ${{ env.OSV_SCANNER_VERSION }}
        run: |
          curl -sSfL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          chmod +x osv-scanner
      - name: Scan
        run: |
          set +e
          ./osv-scanner scan source --lockfile gradle.lockfile --format markdown > osv-report.md
          status=$?
          {
            echo "## OSV dependency scan"
            echo
            echo "Triage notes: docs/SECURITY.md (JDK-component CVEs filed against graal-sdk are false positives here)."
            echo
            cat osv-report.md
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osv-report
          path: osv-report.md
          if-no-files-found: ignore
