name: Release

# Tag vX.Y.Z on main to build, verify and stage a release (#15).
# - Always: full Java 8 build + tests, Java 8 bytecode gate, offline consumer
#   smoke, a staged Maven bundle (signed when GPG_PRIVATE_KEY is set), then a
#   GitHub Release with the jars, LICENSE and THIRD-PARTY-NOTICES.md.
# - Maven Central: only when the repository has the CENTRAL_USERNAME /
#   CENTRAL_PASSWORD (Central Portal user token) and GPG_PRIVATE_KEY /
#   GPG_PASSPHRASE secrets. The bundle is uploaded as USER_MANAGED, so it
#   still has to be published by hand in the Central Portal after review.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stage without publishing (e.g. 0.1.0-rc1)'
        required: true

permissions:
  contents: write

env:
  GRADLE_TOOLCHAIN_ARGS: >-
    -Porg.gradle.java.installations.auto-download=false
    -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_17_X64

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Determine version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; else v="${{ github.event.inputs.version }}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Verify pinned offline Draw.io bundles
        run: node js-bundle/build.mjs --verify
      - name: Build and verify
        run: bash ./gradlew --no-daemon $GRADLE_TOOLCHAIN_ARGS -PreleaseVersion=${{ steps.version.outputs.version }} clean build
      - name: Stage Maven bundle
        id: stage
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_PASSPHRASE }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
        run: |
          if [ -n "$CENTRAL_USERNAME" ] && [ -n "$ORG_GRADLE_PROJECT_signingKey" ]; then
            echo "central=true" >> "$GITHUB_OUTPUT"
          fi
          bash ./gradlew --no-daemon $GRADLE_TOOLCHAIN_ARGS -PreleaseVersion=${{ steps.version.outputs.version }} publish
          (cd build/staging-deploy && find . -name 'maven-metadata*' -delete && zip -qr ../central-bundle.zip .)
          echo "staged=true" >> "$GITHUB_OUTPUT"
      - name: Upload bundle to Maven Central (manual publish)
        if: github.ref_type == 'tag' && steps.stage.outputs.staged == 'true' && steps.stage.outputs.central == 'true'
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          token=$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)
          curl -sSf -X POST \
            -H "Authorization: Bearer $token" \
            -F "bundle=@build/central-bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=drawio-java-${{ steps.version.outputs.version }}&publishingType=USER_MANAGED"
      - name: GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --verify-tag --title "drawio-java ${{ steps.version.outputs.version }}" \
            --notes "See docs/SUPPORT-MATRIX.md for supported and unsupported features and docs/SECURITY.md / docs/LICENSE-REVIEW.md for the audits." \
            build/libs/*.jar LICENSE THIRD-PARTY-NOTICES.md
      - name: Keep staged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.version }}
          path: |
            build/libs/
            build/central-bundle.zip
          if-no-files-found: ignore
